<polyline points="440,853 440,895" fill="none" stroke="#111111" stroke-width="1.6"/>
<polyline points="440,895 285,895 285,936" fill="none" stroke="#111111" stroke-width="1.6" marker-end="url(#arrow)"/>
<polyline points="285,983 285,1030 440,1030" fill="none" stroke="#111111" stroke-width="1.6"/>
<polyline points="440,895 640,895 640,936" fill="none" stroke="#111111" stroke-width="1.6" marker-end="url(#arrow)"/>
<polyline points="640,983 640,1030 440,1030" fill="none" stroke="#111111" stroke-width="1.6"/>
<polyline points="440,1034 440,1066" fill="none" stroke="#111111" stroke-width="1.6" marker-end="url(#arrow)"/>
<polyline points="440,1113 440,1154" fill="none" stroke="#111111" stroke-width="1.6" marker-end="url(#arrow)"/>
<polyline points="440,1196 440,1246" fill="none" stroke="#111111" stroke-width="1.6" marker-end="url(#arrow)"/>
<polyline points="440,1291 440,1341" fill="none" stroke="#111111" stroke-width="1.6" marker-end="url(#arrow)"/>
<polyline points="440,1386 440,1436" fill="none" stroke="#111111" stroke-width="1.6" marker-end="url(#arrow)"/>
<polyline points="440,1481 440,1531" fill="none" stroke="#111111" stroke-width="1.6" marker-end="url(#arrow)"/>
<polyline points="440,1578 440,1619" fill="none" stroke="#111111" stroke-width="1.6" marker-end="url(#arrow)"/>
<polyline points="461,1175 715,1175 715,1436" fill="none" stroke="#111111" stroke-width="1.6" marker-end="url(#arrow)"/>
<polyline points="715,1483 715,1534" fill="none" stroke="#111111" stroke-width="1.6" marker-end="url(#arrow)"/>
<polyline points="694,1555 464,1555" fill="none" stroke="#111111" stroke-width="1.6" marker-end="url(#arrow)"/>
<circle cx="440" cy="105" r="3.5" fill="#111111" data-junction="true"/>
<circle cx="440" cy="895" r="3.5" fill="#111111" data-junction="true"/>
<circle cx="440" cy="1030" r="3.5" fill="#111111" data-junction="true"/>
<g id="node-genomes" data-node-kind="input">
<circle cx="250" cy="45" r="18" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="3"/>
<text x="214" y="52.0" font-size="20" text-anchor="end">Genome FASTAs</text>
</g>
<g id="node-references" data-node-kind="input">
<circle cx="635" cy="45" r="18" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="3"/>
<text x="671" y="39.5" font-size="20" text-anchor="start">Reference databases</text>
<text x="671" y="64.5" font-size="17" text-anchor="start">(CheckM, GTDB R226, GUNC)</text>
</g>
<g id="node-prepare" data-node-kind="process">
<path d="M440 144 L461 165 L440 186 L419 165 Z" fill="#FFFFFF" stroke="#111111" stroke-width="1.2"/>
<text x="404" y="159.5" font-size="20" text-anchor="end">Stage inputs / contig variants</text>
<text x="404" y="184.5" font-size="17" text-anchor="end">(Genome QC, SeqKit)</text>
</g>
<g id="node-statistics" data-node-kind="process">
<path d="M440 239 L461 260 L440 281 L419 260 Z" fill="#FFFFFF" stroke="#111111" stroke-width="1.2"/>
<text x="404" y="254.5" font-size="20" text-anchor="end">Assembly statistics</text>
<text x="404" y="279.5" font-size="17" text-anchor="end">(SeqKit)</text>
</g>
<g id="node-quality" data-node-kind="process">
<path d="M440 334 L461 355 L440 376 L419 355 Z" fill="#FFFFFF" stroke="#111111" stroke-width="1.2"/>
<text x="404" y="349.5" font-size="20" text-anchor="end">Completeness / contamination</text>
<text x="404" y="374.5" font-size="17" text-anchor="end">(CheckM lineage_wf)</text>
</g>
<g id="node-qscore" data-node-kind="process">
<path d="M440 429 L461 450 L440 471 L419 450 Z" fill="#FFFFFF" stroke="#111111" stroke-width="1.2"/>
<text x="404" y="444.5" font-size="20" text-anchor="end">Composite quality score</text>
<text x="404" y="469.5" font-size="17" text-anchor="end">(Genome QC)</text>
</g>
<g id="node-taxonomy" data-node-kind="process">
<path d="M440 524 L461 545 L440 566 L419 545 Z" fill="#FFFFFF" stroke="#111111" stroke-width="1.2"/>
<text x="404" y="539.5" font-size="20" text-anchor="end">Taxonomic classification</text>
<text x="404" y="564.5" font-size="17" text-anchor="end">(GTDB-Tk, R226)</text>
</g>
<g id="node-rrna" data-node-kind="process">
<path d="M440 619 L461 640 L440 661 L419 640 Z" fill="#FFFFFF" stroke="#111111" stroke-width="1.2"/>
<text x="404" y="634.5" font-size="20" text-anchor="end">Predict rRNA genes</text>
<text x="404" y="659.5" font-size="17" text-anchor="end">(barrnap)</text>
</g>
<g id="node-consistency" data-node-kind="process">
<path d="M440 714 L461 735 L440 756 L419 735 Z" fill="#FFFFFF" stroke="#111111" stroke-width="1.2"/>
<text x="404" y="729.5" font-size="20" text-anchor="end">Within-genome rRNA consistency</text>
<text x="404" y="754.5" font-size="17" text-anchor="end">(BLAST+, Genome QC)</text>
</g>
<g id="node-representative" data-node-kind="process">
<path d="M440 809 L461 830 L440 851 L419 830 Z" fill="#FFFFFF" stroke="#111111" stroke-width="1.2"/>
<text x="404" y="824.5" font-size="20" text-anchor="end">Choose one contig-length variant</text>
<text x="404" y="849.5" font-size="17" text-anchor="end">(Qscore, N50, length)</text>
</g>
<g id="node-trna" data-node-kind="process">
<path d="M285 939 L306 960 L285 981 L264 960 Z" fill="#FFFFFF" stroke="#111111" stroke-width="1.2"/>
<text x="249" y="954.5" font-size="20" text-anchor="end">tRNA prediction</text>
<text x="249" y="979.5" font-size="17" text-anchor="end">(tRNAscan-SE)</text>
</g>
<g id="node-gunc" data-node-kind="process">
<path d="M640 939 L661 960 L640 981 L619 960 Z" fill="#FFFFFF" stroke="#111111" stroke-width="1.2"/>
<text x="676" y="954.5" font-size="20" text-anchor="start">Chimerism assessment</text>
<text x="676" y="979.5" font-size="17" text-anchor="start">(GUNC)</text>
</g>
<g id="node-merge" data-node-kind="process">
<path d="M440 1069 L461 1090 L440 1111 L419 1090 Z" fill="#FFFFFF" stroke="#111111" stroke-width="1.2"/>
<text x="404" y="1084.5" font-size="20" text-anchor="end">Integrate measurements / status</text>
<text x="404" y="1109.5" font-size="17" text-anchor="end">(Genome QC)</text>
</g>
<g id="node-master" data-node-kind="output">
<circle cx="440" cy="1175" r="18" fill="#D5E8D4" stroke="#82B366" stroke-width="3"/>
<text x="404" y="1169.5" font-size="20" text-anchor="end">All assessed genomes</text>
<text x="404" y="1194.5" font-size="20" text-anchor="end">Master QC table</text>
</g>
<g id="node-ani" data-node-kind="process">
<path d="M440 1249 L461 1270 L440 1291 L419 1270 Z" fill="#FFFFFF" stroke="#111111" stroke-width="1.2"/>
<text x="404" y="1264.5" font-size="20" text-anchor="end">ANI groups</text>
<text x="404" y="1289.5" font-size="17" text-anchor="end">(FastANI)</text>
</g>
<g id="node-phylogeny" data-node-kind="process">
<path d="M440 1344 L461 1365 L440 1386 L419 1365 Z" fill="#FFFFFF" stroke="#111111" stroke-width="1.2"/>
<text x="404" y="1359.5" font-size="20" text-anchor="end">Marker phylogeny</text>
<text x="404" y="1384.5" font-size="17" text-anchor="end">(GTDB alignments, FastTree)</text>
</g>
<g id="node-atlas" data-node-kind="process">
<path d="M440 1439 L461 1460 L440 1481 L419 1460 Z" fill="#FFFFFF" stroke="#111111" stroke-width="1.2"/>
<text x="404" y="1454.5" font-size="20" text-anchor="end">Genome atlas</text>
<text x="404" y="1479.5" font-size="17" text-anchor="end">(pandas, Matplotlib, seaborn)</text>
</g>
<g id="node-explorer" data-node-kind="process">
<path d="M440 1534 L461 1555 L440 1576 L419 1555 Z" fill="#FFFFFF" stroke="#111111" stroke-width="1.2"/>
<text x="404" y="1549.5" font-size="20" text-anchor="end">Explore / select / export</text>
<text x="404" y="1574.5" font-size="20" text-anchor="end">Genome QC Explorer</text>
</g>
<g id="node-outputs" data-node-kind="output">
<circle cx="440" cy="1640" r="18" fill="#D5E8D4" stroke="#82B366" stroke-width="3"/>
<text x="476" y="1634.5" font-size="20" text-anchor="start">Atlas + linked tables</text>
<text x="476" y="1659.5" font-size="20" text-anchor="start">CSV / selection records</text>
</g>
<g id="node-selection" data-node-kind="process">
<path d="M715 1439 L736 1460 L715 1481 L694 1460 Z" fill="#FFFFFF" stroke="#111111" stroke-width="1.2"/>
<text x="751" y="1454.5" font-size="20" text-anchor="start">Final selection</text>
<text x="751" y="1479.5" font-size="17" text-anchor="start">[optional criteria]</text>
</g>
<g id="node-selected" data-node-kind="output">
<circle cx="715" cy="1555" r="18" fill="#D5E8D4" stroke="#82B366" stroke-width="3"/>
<text x="751" y="1562.0" font-size="20" text-anchor="start">Selected subset</text>
</g>
<circle cx="820" cy="150" r="15" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="3"/>
<text x="784" y="157.0" font-size="20" text-anchor="end">Input</text>
<path d="M820 184 L841 205 L820 226 L799 205 Z" fill="#FFFFFF" stroke="#111111" stroke-width="1.2"/>
<text x="784" y="212.0" font-size="20" text-anchor="end">Process</text>
<circle cx="820" cy="260" r="15" fill="#D5E8D4" stroke="#82B366" stroke-width="3"/>
<text x="784" y="267.0" font-size="20" text-anchor="end">Output</text>
</g></svg>
