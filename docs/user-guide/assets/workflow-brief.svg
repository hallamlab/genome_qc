<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1230" viewBox="0 0 960 1230" data-workflow-style="genome-qc-connected-nodal" role="img" aria-labelledby="title desc">
<title id="title">Genome QC brief workflow</title>
<desc id="desc">Continuous node flow from genome FASTAs and references to assessments, parallel tRNA and GUNC checks, a complete master table, optional selection, atlas and explorer.</desc>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#111111"/></marker></defs>
<g font-family="Trebuchet MS, sans-serif" fill="#111111">
<polyline points="250,65 250,105 440,105" fill="none" stroke="#111111" stroke-width="1.6"/>
<polyline points="635,65 635,105 440,105" fill="none" stroke="#111111" stroke-width="1.6"/>
<polyline points="440,109 440,141" fill="none" stroke="#111111" stroke-width="1.6" marker-end="url(#arrow)"/>
<polyline points="440,186 440,236" fill="none" stroke="#111111" stroke-width="1.6" marker-end="url(#arrow)"/>
<polyline points="440,281 440,331" fill="none" stroke="#111111" stroke-width="1.6" marker-end="url(#arrow)"/>
<polyline points="440,376 440,426" fill="none" stroke="#111111" stroke-width="1.6" marker-end="url(#arrow)"/>
<polyline points="440,471 440,521" fill="none" stroke="#111111" stroke-width="1.6" marker-end="url(#arrow)"/>
<polyline points="440,568 440,610" fill="none" stroke="#111111" stroke-width="1.6"/>
<polyline points="440,610 285,610 285,651" fill="none" stroke="#111111" stroke-width="1.6" marker-end="url(#arrow)"/>
<polyline points="285,698 285,745 440,745" fill="none" stroke="#111111" stroke-width="1.6"/>
<polyline points="440,610 640,610 640,651" fill="none" stroke="#111111" stroke-width="1.6" marker-end="url(#arrow)"/>
<polyline points="640,698 640,745 440,745" fill="none" stroke="#111111" stroke-width="1.6"/>
<polyline points="440,749 440,781" fill="none" stroke="#111111" stroke-width="1.6" marker-end="url(#arrow)"/>
<polyline points="440,828 440,869" fill="none" stroke="#111111" stroke-width="1.6" marker-end="url(#arrow)"/>
<polyline points="440,911 440,961" fill="none" stroke="#111111" stroke-width="1.6" marker-end="url(#arrow)"/>
<polyline points="440,1006 440,1056" fill="none" stroke="#111111" stroke-width="1.6" marker-end="url(#arrow)"/>
<polyline points="440,1103 440,1144" fill="none" stroke="#111111" stroke-width="1.6" marker-end="url(#arrow)"/>
<polyline points="461,890 715,890 715,961" fill="none" stroke="#111111" stroke-width="1.6" marker-end="url(#arrow)"/>
<polyline points="715,1008 715,1059" fill="none" stroke="#111111" stroke-width="1.6" marker-end="url(#arrow)"/>
<polyline points="694,1080 464,1080" fill="none" stroke="#111111" stroke-width="1.6" marker-end="url(#arrow)"/>
<circle cx="440" cy="105" r="3.5" fill="#111111" data-junction="true"/>
<circle cx="440" cy="610" r="3.5" fill="#111111" data-junction="true"/>
<circle cx="440" cy="745" r="3.5" fill="#111111" data-junction="true"/>
<g id="node-genomes" data-node-kind="input">
<circle cx="250" cy="45" r="18" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="3"/>
<text x="214" y="52.0" font-size="20" text-anchor="end">Genome FASTAs</text>
</g>
<g id="node-references" data-node-kind="input">
<circle cx="635" cy="45" r="18" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="3"/>
<text x="671" y="39.5" font-size="20" text-anchor="start">Reference databases</text>
<text x="671" y="64.5" font-size="17" text-anchor="start">(CheckM, GTDB R226, GUNC)</text>
</g>
<g id="node-prepare" data-node-kind="process">
<path d="M440 144 L461 165 L440 186 L419 165 Z" fill="#FFFFFF" stroke="#111111" stroke-width="1.2"/>
<text x="404" y="159.5" font-size="20" text-anchor="end">Preprocessing</text>
<text x="404" y="184.5" font-size="17" text-anchor="end">(SeqKit)</text>
</g>
<g id="node-quality" data-node-kind="process">
<path d="M440 239 L461 260 L440 281 L419 260 Z" fill="#FFFFFF" stroke="#111111" stroke-width="1.2"/>
<text x="404" y="254.5" font-size="20" text-anchor="end">Completeness / contamination</text>
<text x="404" y="279.5" font-size="17" text-anchor="end">(CheckM, Qscore)</text>
</g>
<g id="node-taxonomy" data-node-kind="process">
<path d="M440 334 L461 355 L440 376 L419 355 Z" fill="#FFFFFF" stroke="#111111" stroke-width="1.2"/>
<text x="404" y="349.5" font-size="20" text-anchor="end">Taxonomic classification</text>
<text x="404" y="374.5" font-size="17" text-anchor="end">(GTDB-Tk)</text>
</g>
<g id="node-rrna" data-node-kind="process">
<path d="M440 429 L461 450 L440 471 L419 450 Z" fill="#FFFFFF" stroke="#111111" stroke-width="1.2"/>
<text x="404" y="444.5" font-size="20" text-anchor="end">rRNA prediction / consistency</text>
<text x="404" y="469.5" font-size="17" text-anchor="end">(barrnap, BLAST+)</text>
</g>
<g id="node-representative" data-node-kind="process">
<path d="M440 524 L461 545 L440 566 L419 545 Z" fill="#FFFFFF" stroke="#111111" stroke-width="1.2"/>
<text x="404" y="539.5" font-size="20" text-anchor="end">Representative per genome</text>
<text x="404" y="564.5" font-size="17" text-anchor="end">(Qscore, N50, length)</text>
</g>
<g id="node-trna" data-node-kind="process">
<path d="M285 654 L306 675 L285 696 L264 675 Z" fill="#FFFFFF" stroke="#111111" stroke-width="1.2"/>
<text x="249" y="669.5" font-size="20" text-anchor="end">tRNA prediction</text>
<text x="249" y="694.5" font-size="17" text-anchor="end">(tRNAscan-SE)</text>
</g>
<g id="node-gunc" data-node-kind="process">
<path d="M640 654 L661 675 L640 696 L619 675 Z" fill="#FFFFFF" stroke="#111111" stroke-width="1.2"/>
<text x="676" y="669.5" font-size="20" text-anchor="start">Chimerism assessment</text>
<text x="676" y="694.5" font-size="17" text-anchor="start">(GUNC)</text>
</g>
<g id="node-merge" data-node-kind="process">
<path d="M440 784 L461 805 L440 826 L419 805 Z" fill="#FFFFFF" stroke="#111111" stroke-width="1.2"/>
<text x="404" y="799.5" font-size="20" text-anchor="end">Integrate measurements / status</text>
<text x="404" y="824.5" font-size="17" text-anchor="end">(Genome QC)</text>
</g>
<g id="node-master" data-node-kind="output">
<circle cx="440" cy="890" r="18" fill="#D5E8D4" stroke="#82B366" stroke-width="3"/>
<text x="404" y="884.5" font-size="20" text-anchor="end">All assessed genomes</text>
<text x="404" y="909.5" font-size="20" text-anchor="end">Master QC table</text>
</g>
<g id="node-atlas" data-node-kind="process">
<path d="M440 964 L461 985 L440 1006 L419 985 Z" fill="#FFFFFF" stroke="#111111" stroke-width="1.2"/>
<text x="404" y="979.5" font-size="20" text-anchor="end">Genome atlas</text>
<text x="404" y="1004.5" font-size="17" text-anchor="end">(pandas, Matplotlib, seaborn)</text>
</g>
<g id="node-explorer" data-node-kind="process">
<path d="M440 1059 L461 1080 L440 1101 L419 1080 Z" fill="#FFFFFF" stroke="#111111" stroke-width="1.2"/>
<text x="404" y="1074.5" font-size="20" text-anchor="end">Explore / select / export</text>
<text x="404" y="1099.5" font-size="20" text-anchor="end">Genome QC Explorer</text>
</g>
<g id="node-outputs" data-node-kind="output">
<circle cx="440" cy="1165" r="18" fill="#D5E8D4" stroke="#82B366" stroke-width="3"/>
<text x="476" y="1159.5" font-size="20" text-anchor="start">Atlas + linked tables</text>
<text x="476" y="1184.5" font-size="20" text-anchor="start">CSV / selection records</text>
</g>
<g id="node-selection" data-node-kind="process">
<path d="M715 964 L736 985 L715 1006 L694 985 Z" fill="#FFFFFF" stroke="#111111" stroke-width="1.2"/>
<text x="751" y="979.5" font-size="20" text-anchor="start">Final selection</text>
<text x="751" y="1004.5" font-size="17" text-anchor="start">[optional criteria]</text>
</g>
<g id="node-selected" data-node-kind="output">
<circle cx="715" cy="1080" r="18" fill="#D5E8D4" stroke="#82B366" stroke-width="3"/>
<text x="751" y="1087.0" font-size="20" text-anchor="start">Selected subset</text>
</g>
<circle cx="820" cy="150" r="15" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="3"/>
<text x="784" y="157.0" font-size="20" text-anchor="end">Input</text>
<path d="M820 184 L841 205 L820 226 L799 205 Z" fill="#FFFFFF" stroke="#111111" stroke-width="1.2"/>
<text x="784" y="212.0" font-size="20" text-anchor="end">Process</text>
<circle cx="820" cy="260" r="15" fill="#D5E8D4" stroke="#82B366" stroke-width="3"/>
<text x="784" y="267.0" font-size="20" text-anchor="end">Output</text>
</g></svg>
