name: Documentation build and diagram rendering
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'docs/user-guide/**'
      - 'scripts/check_docs_browser.py'
      - '.github/workflows/docs.yml'
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r docs/user-guide/requirements.txt playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - run: python -m sphinx -W --keep-going -b html docs/user-guide /tmp/genome-qc-guide
      - run: python scripts/check_docs_browser.py /tmp/genome-qc-guide
