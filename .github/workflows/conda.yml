name: Build, validate and publish Conda package
on:
  workflow_dispatch:
    inputs:
      publish_anaconda:
        description: Publish the validated package to Anaconda (main only)
        type: boolean
        default: false
      real_genome_test_passed:
        description: Confirm the full real-genome workflow test passed for this release
        type: boolean
        default: false
  pull_request:
    paths:
      - 'genome_qc/**'
      - '*.py'
      - '*.nf'
      - 'nextflow.config'
      - 'pyproject.toml'
      - 'envs/**'
      - 'conda_recipe/**'
      - 'tests/test_workflow_integration.py'
      - 'tests/test_task_runtime_contracts.py'
      - 'tests/tool_contract_fixture.py'
      - 'scripts/prepare_conda_recipe.py'
      - '.github/workflows/conda.yml'
permissions:
  contents: read
jobs:
  validate-request:
    runs-on: ubuntu-latest
    steps:
      - name: Validate publication request
        env:
          PUBLISH: ${{ inputs.publish_anaconda || false }}
          REAL_TEST_PASSED: ${{ inputs.real_genome_test_passed || false }}
        run: |
          if [[ "$PUBLISH" == true ]]; then
            [[ "$GITHUB_REF" == refs/heads/main ]] || { echo 'Publish from main after merging the tested refactor.'; exit 1; }
            [[ "$REAL_TEST_PASSED" == true ]] || { echo 'Confirm the full real-genome test passed before publication.'; exit 1; }
          fi
  conda:
    needs: validate-request
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: build-tools
          create-args: >-
            python=3.11 conda-build conda-index pyyaml
            -c conda-forge
      - name: Prepare allow-listed source and recipe
        run: python scripts/prepare_conda_recipe.py --output dist/conda-source
      - name: Build package and test installed CLI
        run: conda build dist/conda-source/recipe --override-channels -c conda-forge -c bioconda --no-anaconda-upload --output-folder dist/channel
      - name: Install artifact into a clean environment
        run: |
          conda index dist/channel
          micromamba create -y -p "$RUNNER_TEMP/genome-qc-test" --override-channels --strict-channel-priority \
            -c "file://$PWD/dist/channel" -c conda-forge -c bioconda genome-qc seqkit blast fastani fasttree=2.1.11 biopython
      - name: Validate packaged workflow orchestration
        env:
          GQC_NF_INTEGRATION: '1'
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          export GQC_TEST_RUNTIME="$RUNNER_TEMP/genome-qc-test/share/genome_qc"
          cd "$RUNNER_TEMP"
          micromamba run -p "$RUNNER_TEMP/genome-qc-test" python -m unittest discover \
            -s "$GITHUB_WORKSPACE/tests" -p test_workflow_integration.py -v
          micromamba run -p "$RUNNER_TEMP/genome-qc-test" python -m unittest discover \
            -s "$GITHUB_WORKSPACE/tests" -p test_task_runtime_contracts.py -v
      - name: Record artifact checksums
        run: |
          cd dist/channel/linux-64
          sha256sum genome-qc-*.conda > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: genome-qc-conda
          path: |
            dist/channel/linux-64/genome-qc-*.conda
            dist/channel/linux-64/SHA256SUMS
            dist/conda-source/source-provenance.json
          if-no-files-found: error

  publish-anaconda:
    needs: conda
    if: github.event_name == 'workflow_dispatch' && inputs.publish_anaconda
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: genome-qc-anaconda-publication
      cancel-in-progress: false
    defaults:
      run:
        shell: bash -el {0}
    env:
      ANACONDA_OWNER: ${{ vars.ANACONDA_OWNER || 'hallamlab' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: genome-qc-conda
          path: packages
      - name: Verify tested artifact
        run: |
          cd packages/channel/linux-64
          sha256sum --check SHA256SUMS
          shopt -s nullglob
          packages=(genome-qc-*.conda)
          [[ ${#packages[@]} == 1 ]] || { echo 'Expected exactly one tested package'; exit 1; }
          filename="${packages[0]#genome-qc-}"
          echo "PACKAGE_VERSION=${filename%%-*}" >> "$GITHUB_ENV"
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: upload-tools
          create-args: >-
            python=3.11 anaconda-client
            -c conda-forge
      - name: Publish tested package
        env:
          BINSTAR_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
        run: |
          test -n "$BINSTAR_API_TOKEN" || { echo 'Set ANACONDA_API_TOKEN in repository secrets or the release environment.'; exit 1; }
          anaconda upload --user "$ANACONDA_OWNER" --label main packages/channel/linux-64/genome-qc-*.conda
      - name: Install published version from Anaconda
        run: |
          micromamba create -y -p "$RUNNER_TEMP/published-genome-qc" \
            --override-channels --strict-channel-priority \
            -c conda-forge -c bioconda -c "$ANACONDA_OWNER" "genome-qc=$PACKAGE_VERSION"
          micromamba run -p "$RUNNER_TEMP/published-genome-qc" genome_qc --version
          micromamba run -p "$RUNNER_TEMP/published-genome-qc" genome_qc check
          micromamba run -p "$RUNNER_TEMP/published-genome-qc" genome_qc run --help
          echo "Published and installed genome-qc $PACKAGE_VERSION from $ANACONDA_OWNER." >> "$GITHUB_STEP_SUMMARY"
