name: Remove withdrawn Genome QC test artifact
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  remove-test-artifact:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Verify artifact is test-only
        run: |
          python - <<'PY'
          import json, urllib.request
          data = json.load(urllib.request.urlopen('https://api.anaconda.org/package/hallamlab/genome-qc'))
          files = [f for f in data['files'] if f['basename'] == 'linux-64/genome-qc-0.1.0-py311_0.conda']
          assert len(files) == 1 and files[0]['labels'] == ['test'], files
          PY
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: cleanup-tools
          create-args: python=3.11 anaconda-client -c conda-forge
      - name: Remove only the withdrawn test artifact
        shell: bash -el {0}
        env:
          BINSTAR_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
        run: anaconda remove --force hallamlab/genome-qc/0.1.0/linux-64/genome-qc-0.1.0-py311_0.conda
